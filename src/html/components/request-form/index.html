<form action="" class="request-form {{formClassName}}">
<h3 class="request-form_title">Make your Ride!</h3>
<div class="request-form_text">
    <p>This can salutandi quo nec elit utinam facer pertinax a
fierent, virtute dosent.</p>
</div>



<div class="request-form_body">
<div class="request-form_group">
    <label for="request[name]" class="request-form_label sr-only">Enter Your Name</label>
    <input type="text" class="request-form_input" id="request[name]" name="request[name]" placeholder="Your Name" required>
</div>
<div class="request-form_group">
    <label for="request[phone]" class="request-form_label sr-only">Enter Your Phone Number</label>
    <input type="text" class="request-form_input" id="request[phone]" name="request[phone]" placeholder="Your Phone" required>
</div>
<div class="request-form_group">
    <label for="request[email]" class="request-form_label sr-only">Enter Your Email</label>
    <input type="text" class="request-form_input" id="request[email]" name="request[email]" placeholder="Your Email" required>
</div>
<button class="btn request-form_btn">request a call</button>
</div>
<p class="request-form_footer">
    Your data will not be shared with third parties.
</p>
</form>
